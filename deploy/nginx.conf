# Site em produção: arquivos estáticos do Vite + /api e /uploads repassados à API.
# Tudo no mesmo domínio, então o navegador não precisa de CORS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads de fotos/vídeos (a API aceita até 20 MB).
  client_max_body_size 25m;

  # DNS interno do Docker: reencontra a API mesmo se o container dela for recriado.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3333;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /uploads/ {
    proxy_pass $api;
    expires 30d;
  }

  # Arquivos com hash no nome: cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer outra rota cai no index.html (React Router decide).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
