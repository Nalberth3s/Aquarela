# Aquarela do Saber — ambiente local completo
#   docker compose up -d --build
#   Site ........ http://localhost:5173
#   API ......... http://localhost:3333/api/health
#   Adminer ..... http://localhost:8080  (Sistema: PostgreSQL · Servidor: db · Usuário/Senha/Base: aquarela)
name: aquarela

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aquarela
      POSTGRES_PASSWORD: aquarela
      POSTGRES_DB: aquarela
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquarela -d aquarela"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://aquarela:aquarela@db:5432/aquarela
      JWT_SECRET: ${JWT_SECRET:-aquarela-local-troque-em-producao}
      PUBLIC_URL: http://localhost:3333
      CORS_ORIGIN: http://localhost:5173
      UPLOADS_DIR: /app/uploads
      # Acesso de desenvolvedor (aba "Banco" da coordenação). Senha guardada só como hash bcrypt
      # ("$$" é o escape do "$" no compose). Sem essas duas variáveis a aba fica desativada.
      DEV_EMAIL: ${DEV_EMAIL:-nalberthelias769@gmail.com}
      DEV_PASSWORD_HASH: ${DEV_PASSWORD_HASH:-$$2b$$10$$MRZf5A.i48kYdSpQhuXW4OXSBXiIjuOffTfrUpOXjKJig9LiCpT8K}
    ports:
      - "3333:3333"
    volumes:
      - uploads:/app/uploads
      - ./server/src:/app/src
      - ./server/db:/app/db
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      VITE_API_URL: http://localhost:3333
      VITE_USE_MOCKS: "false"
      VITE_POLLING: "true"
      VITE_SITE_URL: ${SITE_URL:-http://localhost:5173}
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./seo.plugin.ts:/app/seo.plugin.ts
    depends_on:
      - api

  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db-data:
  uploads:
