<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520" fill="none">
  <!-- SÍMBOLO HEXAGONAL GEOMÉTRICO FIEL AO ORIGINAL -->
  <!-- 6 Facetas Trapezoidais com encaixe milimétrico e vão interno branco -->
  <g id="hexagon-ring">
    <!-- 1. Topo: Azul Real / Ciano Vivo -->
    <polygon points="186,40 314,40 286,95 214,95" fill="#007ACC" />

    <!-- 2. Superior Direito: Vermelho Vivo -->
    <polygon points="320,44 384,155 328,155 292,99" fill="#E62B2B" />

    <!-- 3. Inferior Direito: Amarelo Ouro / Mostarda Quente -->
    <polygon points="384,165 320,276 292,221 328,165" fill="#F8B300" />

    <!-- 4. Base: Roxo Índigo / Azul Noite -->
    <polygon points="314,280 186,280 214,225 286,225" fill="#2E2468" />

    <!-- 5. Inferior Esquerdo: Verde Folha -->
    <polygon points="180,276 116,165 172,165 208,221" fill="#58B82B" />

    <!-- 6. Superior Esquerdo: Laranja Vibrante -->
    <polygon points="116,155 180,44 208,99 172,155" fill="#FF7700" />
  </g>

  <!-- Espaço Central: Monograma 'As' idêntico ao traço artesanal original -->
  <!-- Letra 'A' maiúscula cursiva elegante com laço + 'S' caligráfico entrelaçado -->
  <g id="monogram-as" fill="#18181B">
    <text x="250" y="185" text-anchor="middle" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif" font-size="94" font-weight="700" font-style="italic" letter-spacing="-4">As</text>
  </g>

  <!-- TIPOGRAFIA INSTITUCIONAL CURSIVA / ARTESANAL -->
  <g id="brand-text" fill="#18181B" text-anchor="middle">
    <!-- Linha 1: Centro Educacional -->
    <text x="250" y="375" font-family="'Caveat', 'Dancing Script', 'Comfortaa', cursive, sans-serif" font-size="44" font-weight="700" letter-spacing="1">Centro Educacional</text>
    
    <!-- Linha 2: Aquarela do Saber -->
    <text x="250" y="445" font-family="'Caveat', 'Dancing Script', 'Comfortaa', cursive, sans-serif" font-size="52" font-weight="700" letter-spacing="1.5">Aquarela do Saber</text>
  </g>
</svg>
